<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoRanker for socials</title>
    <meta name="description" content="Daily GeoRankl standings, records and fun analytics for the group." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="brand">
          <span class="brand-mark">🌍</span>
          <div>
            <h1>GeoRanker <span class="brand-accent">for socials</span></h1>
            <p class="tagline">Daily winners, the running tally &amp; a pile of fun analytics.</p>
          </div>
        </div>
        <div class="updated" id="updated">Loading…</div>
      </div>
    </header>

    <main class="wrap" id="app">
      <div class="loading" id="loading">Loading the league…</div>
      <div class="error" id="error" hidden></div>
      <section class="stat-strip" id="summary" hidden></section>
      <div class="grid" id="cards" hidden></div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>Built for the group · scores tallied automatically · <span id="tz"></span></p>
      </div>
    </footer>

    <script src="/app.js" defer></script>
  </body>
</html>
